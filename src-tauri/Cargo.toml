[package]
name = "ibuku"
version = "1.0.0"
description = "ibuku - Authoring Suite"
authors = ["mwakidenis <Mwakidenice@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/mwakidenis/ibuku"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ibuku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ibuku"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.8"
rfd = "0.15"

