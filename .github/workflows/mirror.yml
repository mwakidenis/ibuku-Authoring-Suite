name: Mirror to SourceForge

on:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@git.sourceforge.net:/p/ibuku-authoring-suite/code
          ssh_private_key: ${{ secrets.SF_SSH_PRIVATE_KEY }}
